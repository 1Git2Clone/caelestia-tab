[package]
name = "caelestia-tab"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native messaging helper that streams the caelestia colour scheme and wallpaper to the caelestia-tab extension"
license = "MIT"
repository = "https://git.hu-tao.dev/hutao/caelestia-tab"

[dependencies]
base64 = "0.22"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
