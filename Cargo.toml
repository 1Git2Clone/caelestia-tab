[package]
name = "caelestia-tab"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native messaging helper that streams the caelestia colour scheme and wallpaper to the caelestia-tab extension"
license = "MIT"
repository = "https://git.hu-tao.dev/hutao/caelestia-tab"

[dependencies]
async-trait = "0.1"
base64 = "0.23"
futures-util = "0.3"
notify = "8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "fs", "process"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
