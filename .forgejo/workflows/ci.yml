name: CI

# Docs-only changes skip it: pages.yml builds the handbook, and nothing here
# reads Markdown.
on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

# Cancel superseded runs when a branch is pushed repeatedly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on nix-node, the vps repo's runner label that carries both
# nix and node, and uses the dev shell, so CI has the toolchain a contributor
# and the pre-commit hook have. The Rust jobs first ran on ubuntu-latest with
# rustup, as serenity-discord-bot's do, and all three failed within 6-32s on
# this repo's first run (2026-09-27; cause unconfirmed, the logs weren't read),
# while the nix-node jobs passed.
#
# A job's nix store starts empty, so each job downloads its shell again: .#ci,
# the dev shell less the UI tests' 2.2 GiB of browsers, for all but those
# tests. And the runner takes two jobs at a time, so fmt, clippy and test are
# one job, paying for the toolchain once, and the flake build is nix.yml's,
# run only when the packaging changes: two jobs here fill the runner, a third
# queued behind them.
jobs:
  rust:
    runs-on: nix-node
    env:
      # No debug info: nobody debugs a CI build, and it's most of target/'s
      # size, which the cache uploads and downloads.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7.0.1
      # What serenity-discord-bot's Swatinem/rust-cache keeps, by hand: that
      # action asks cargo and rustc for its key, and they're only on PATH
      # inside nix develop. flake.lock is in the key for the toolchain.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: rust-
      - name: fmt
        run: nix develop .#ci -c cargo fmt --check
      - name: clippy
        run: nix develop .#ci -c cargo clippy --all-targets -- -D warnings
      - name: test
        run: nix develop .#ci -c cargo test --verbose

  extension:
    runs-on: nix-node
    steps:
      - uses: actions/checkout@v7.0.1
      - name: node --test
        run: nix develop -c node --test tests/*.test.mjs
      - name: npm ci
        run: nix develop -c npm ci --prefix extension
      - name: svelte-check
        run: nix develop -c npm run --prefix extension check
      - name: build
        run: nix develop -c npm run --prefix extension build
      - name: web-ext lint
        run: nix develop -c web-ext lint --source-dir extension/dist --self-hosted
      # The UI, in Playwright's Firefox from nixpkgs; unlike the e2e test it
      # needs no installed browser or home directory.
      - name: playwright
        run: nix develop -c npm run --prefix extension test
