name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Cancel superseded runs when a branch is pushed repeatedly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on nix-node, the vps repo's runner label that carries both
# nix and node, and uses the dev shell, so CI has the toolchain a contributor
# and the pre-commit hook have. The Rust jobs first ran on ubuntu-latest with
# rustup, as serenity-discord-bot's do, and all three failed within 6-32s on
# this repo's first run (2026-09-27; cause unconfirmed, the logs weren't read),
# while the nix-node jobs passed.
jobs:
  fmt:
    runs-on: nix-node
    steps:
      - uses: actions/checkout@v7.0.1
      - run: nix develop -c cargo fmt --check

  clippy:
    runs-on: nix-node
    steps:
      - uses: actions/checkout@v7.0.1
      - run: nix develop -c cargo clippy --all-targets -- -D warnings

  test:
    runs-on: nix-node
    steps:
      - uses: actions/checkout@v7.0.1
      - run: nix develop -c cargo test --verbose

  extension:
    runs-on: nix-node
    steps:
      - uses: actions/checkout@v7.0.1
      - name: node --test
        run: nix develop -c node --test tests/*.test.mjs
      - name: web-ext lint
        run: nix develop -c web-ext lint --source-dir extension --self-hosted

  nix:
    runs-on: nix-node
    steps:
      - uses: actions/checkout@v7.0.1
      # Builds the helper the way a flake user gets it, manifest included.
      - run: nix build -L .#default && test -s result/lib/mozilla/native-messaging-hosts/caelestia_tab.json
      # The whole path in a real headless Firefox, against the helper just built.
      - name: End to end
        run: HELPER=$PWD/result/bin/caelestia-tab nix shell nixpkgs#firefox nixpkgs#geckodriver nixpkgs#nodejs -c node tests/e2e-firefox.mjs
