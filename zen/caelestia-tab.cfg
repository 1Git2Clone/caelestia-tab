// caelestia-tab: live Zen colours. (Zen skips this first line of the file.)
//
// The caelestia-tab helper rewrites the caelestia-tab Zen mod whenever the
// caelestia scheme changes. Zen reloads its mods only when the pref below
// flips, which is all its own "update mods" does, so this watches the mod's
// chrome.css once a second and flips the pref when it changes or appears.
// It reads one file's timestamp and sets one pref; nothing else.
try {
  const { classes: Cc, interfaces: Ci, utils: Cu } = Components;
  const PREF = "zen.mods.updated-value-observer";
  const watch = {
    // null until the first check, 0 while the file doesn't exist.
    last: null,
    notify() {
      try {
        const file = Services.dirsvc.get("ProfD", Ci.nsIFile);
        for (const part of ["chrome", "zen-themes", "caelestia-tab", "chrome.css"]) file.append(part);
        const t = file.exists() ? file.lastModifiedTime : 0;
        if (this.last !== null && t !== this.last && t !== 0) {
          Services.prefs.setBoolPref(PREF, !Services.prefs.getBoolPref(PREF, false));
        }
        this.last = t;
      } catch (e) {
        Cu.reportError(`caelestia-tab: ${e}`);
      }
    },
  };
  // Autoconfig runs before a profile is chosen, so start once the UI is up.
  Services.obs.addObserver(function start() {
    Services.obs.removeObserver(start, "final-ui-startup");
    watch.timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
    watch.timer.initWithCallback(watch, 1000, Ci.nsITimer.TYPE_REPEATING_SLACK);
    // Keeps the timer from being collected.
    globalThis.caelestiaTabWatch = watch;
  }, "final-ui-startup");
} catch (e) {
  dump(`caelestia-tab: ${e}\n`);
}
